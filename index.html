<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WhiteFish61</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        background:white;
        width:100vw;
        height:100vh;

        display:flex;
        justify-content:center;
        align-items:center;

        overflow:hidden;
    }

    .image-container{
        width:80vw;
        max-width:1000px;

        aspect-ratio:16/9;

        background:#f5f5f5;

        border-radius:12px;

        overflow:hidden;

        box-shadow:
        0 10px 30px rgba(0,0,0,0.08);
    }

    .image-container img{
        width:100%;
        height:100%;

        object-fit:cover;

        display:block;
    }
</style>
</head>

<body>

<div class="image-container">

    <!-- 换成你的图片 -->
    <img src="pic/WhiteFish61.jpg" alt="图片">

</div>

</body>
</html>
